const data=JSON.parse(document.getElementById('data').textContent),mode='workshop',$=id=>document.getElementById(id);let index=0,shown=false,finished=false,attempted={},correct={},selected=data.colors[0].id;
const titles={movement:'Rengi bul ve göster',matching:'Renkle nesneyi eşleştir',workshop:'Birlikte resim yapıyoruz',share:'Göster ve anlat',exit:'En sevdiğin renk hangisi?'};
function label(c){return c.name+' — '+data.fr[c.id];}
function render(){const c=data.colors[index%data.colors.length];$('title').textContent=titles[mode];$('progress').textContent=(index%data.colors.length+1)+' / '+data.colors.length;$('patch').style.background=c.hex;$('name').textContent=label(c);$('name').hidden=!shown;$('feedback').textContent='';$('options').replaceChildren();
 const prompts={movement:'Sınıfta bu renkte bir nesne bul ve göster.',matching:'Bu renkle hikâyede hangi nesne boyanmıştı? Önce söyle, sonra bir resim seç.',share:'Bu renkte bir nesne göster. Renk + nesne kullanarak kısa bir cümle söyle.'};$('prompt').textContent=prompts[mode]||'';
 if(mode==='matching'){let options=[c,data.colors[(index+2)%data.colors.length],data.colors[(index+5)%data.colors.length]];if(index%3)options=[...options.slice(index%3),...options.slice(0,index%3)];for(const option of options){const b=document.createElement('button');b.className='option';b.setAttribute('data-color-id',option.id);b.innerHTML=data.objects[option.id];b.onclick=()=>{if(!(c.id in attempted)){attempted[c.id]=true;correct[c.id]=option.id===c.id;}if(option.id===c.id){$('feedback').textContent='Evet! '+c.phrase+' · '+label(c);shown=true;$('name').hidden=false;}else $('feedback').textContent='Bu başka bir nesne. Bir daha dene.';};$('options').append(b);}}
 $('teacher').textContent=mode==='matching'?'İlk bağımsız seçim ayrı sayılır. Söylediği sözcüğü öğretmen gözlem formuna not edebilir.':'Çocuk söyledikten sonra renk adını açın. Fransızca adı Türkçe sözcüğe destek olarak kullanabilirsiniz.';
}
function setupPainting(){for(const id of ['patch','wordTools','options','name'])$(id).hidden=true;$('paint').hidden=false;$('prompt').textContent='Önce rengi seç, sonra bir nesneyi boya. Renk bulucu, ressam ve anlatıcı rolleri sırayla değişsin.';$('teacher').textContent='Mavi gökyüzü ve göl; yeşil yapraklar ve çimenler; siyah karga. Kendi resminizde yeni nesneler ve farklı seçimler de ekleyebilirsiniz.';$('drawing').innerHTML=data.outline;$('model').innerHTML=data.model;
 for(const c of data.colors){const b=document.createElement('button');b.style.background=c.hex;b.setAttribute('aria-label',label(c));b.setAttribute('aria-pressed',String(c.id===selected));b.onclick=()=>{selected=c.id;for(const x of $('palette').children)x.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');};$('palette').append(b);}
 $('drawing').addEventListener('click',event=>{const region=event.target.closest('[data-region]');if(!region)return;const id=region.dataset.region,hex=data.colors.find(c=>c.id===selected).hex;for(const shape of $('drawing').querySelectorAll('[data-region="'+id+'"]'))shape.setAttribute('fill',hex);});
 $('printA4').onclick=()=>window.print();$('showModel').onclick=()=>{$('model').hidden=!$('model').hidden;};$('clear').onclick=()=>{$('drawing').innerHTML=data.outline;};$('save').onclick=()=>{const xml=$('drawing').querySelector('svg').outerHTML,url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='benim-renkli-koyum.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}
function setupExit(){for(const id of ['patch','wordTools','options','name'])$(id).hidden=true;$('favorites').hidden=false;$('prompt').textContent='Bir renk seç ve “En sevdiğim renk ...” cümlesini tamamla. Sonra çevrende o renkte bir şey bul.';$('teacher').textContent='Bu sorunun tek doğru cevabı yoktur. A4 öğrenci sayfasındaki tercih ve yeni nesne alanlarını tamamlatın.';for(const c of data.colors){const b=document.createElement('button'),chip=document.createElement('span'),name=document.createElement('span');chip.className='chip';chip.style.background=c.hex;name.textContent=label(c);b.append(chip,name);b.onclick=()=>{$('feedback').textContent='En sevdiğim renk '+c.name.toLocaleLowerCase('tr')+'. / Ma couleur préférée est le '+data.fr[c.id].toLowerCase()+'.';};$('favorites').append(b);}}
 $('nameToggle').onclick=()=>{shown=!shown;$('name').hidden=!shown;};$('next').onclick=()=>{if(finished){index=0;shown=false;finished=false;attempted={};correct={};$('next').textContent='Sonraki renk →';render();return;}index++;shown=false;if(mode==='matching'&&index===data.colors.length){const n=Object.values(correct).filter(Boolean).length;$('feedback').textContent='İlk seçimde '+n+' / '+data.colors.length+' eşleşme doğru. Yeniden çalışabilirsiniz.';finished=true;$('next').textContent='Yeni tur başlat';return;}render();};render();if(mode==='workshop')setupPainting();if(mode==='exit')setupExit();
